services:
    postgres:
        image: postgres:17-alpine
        container_name: neltrik-postgres

        restart: unless-stopped

        environment:
            POSTGRES_DB: ${DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

        ports:
            - "${DATABASE_PORT}:5432"

        volumes:
            - postgres-data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: neltrik-redis

        restart: unless-stopped

        ports:
            - "${REDIS_PORT}:6379"

        command: redis-server --requirepass ${REDIS_PASSWORD}

        volumes:
            - redis-data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    clamav:
        image: clamav/clamav:stable
        container_name: neltrik-clamav

        restart: unless-stopped

        ports:
            - "${CLAMAV_PORT}:3310"

        volumes:
            - clamav-data:/var/lib/clamav

        healthcheck:
            test: ["CMD", "clamdcheck.sh"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s

volumes:
    postgres-data:
        driver: local

    redis-data:
        driver: local

    clamav-data:
        driver: local
